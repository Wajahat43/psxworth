name: Verify

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-and-types:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run lint:types

  build:
    name: Next.js build (dummy env)
    runs-on: ubuntu-latest
    needs: lint-and-types
    # Dummy values that satisfy build-time SDK format checks without
    # exposing real secrets. Safe to run on fork PRs.
    env:
      AI_GATEWAY_API_KEY: dummy
      CLERK_SECRET_KEY: sk_test_dummy_value_for_build_only
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_dummy
      POSTHOG_ENV_ID: ""
      POSTHOG_PERSONAL_API_KEY: ""
      USER_DATABASE_URL: postgres://noop:noop@localhost:5432/noop
      DATA_DATABASE_URL: postgres://noop:noop@localhost:5432/noop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  docker-build:
    name: Docker build (real env)
    runs-on: ubuntu-latest
    needs: [lint-and-types, build]
    # Only run for PRs from branches inside this repo. Fork PRs cannot
    # access secrets, so this job is skipped — and it must not be a
    # required status check in branch protection.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: development
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      POSTHOG_ENV_ID: ${{ secrets.POSTHOG_ENV_ID }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      USER_DATABASE_URL: ${{ secrets.USER_DATABASE_URL }}
      DATA_DATABASE_URL: ${{ secrets.DATA_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/ghcr require lowercase repository names; normalize once for tags/cache
      - name: Normalize repository name (lowercase for Docker)
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image (verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: false
          tags: ghcr.io/${{ env.REPO_LC }}:verify
          # Keep verify cache isolated from deploy cache to prevent PR runs
          # from mutating the cache used by development/production deploys.
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}:buildcache-arm64-verify
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}:buildcache-arm64-verify,mode=min
          build-args: |
            AI_GATEWAY_API_KEY=${{ env.AI_GATEWAY_API_KEY }}
            CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
            POSTHOG_ENV_ID=${{ env.POSTHOG_ENV_ID }}
            POSTHOG_PERSONAL_API_KEY=${{ env.POSTHOG_PERSONAL_API_KEY }}
            USER_DATABASE_URL=${{ env.USER_DATABASE_URL }}
            DATA_DATABASE_URL=${{ env.DATA_DATABASE_URL }}

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [lint-and-types, build, docker-build]
    if: always()
    steps:
      - name: Verify required checks passed
        run: |
          if [[ "${{ needs.lint-and-types.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "Required lint/build checks failed."
            exit 1
          fi
          # Docker only runs for same-repo PRs; skipped is OK for fork PRs.
          if [[ "${{ needs.docker-build.result }}" != "success" && "${{ needs.docker-build.result }}" != "skipped" ]]; then
            echo "Docker build failed."
            exit 1
          fi
